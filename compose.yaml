name: webhaven
services:
  publisher:
    build:
      context: .
      target: publisher
    command: [node, apps/publisher/src/main.js]
    init: true
    environment:
      PUBLISHER_HOST: 0.0.0.0
      PUBLISHER_PORT: 8081
      PUBLISHER_DATA_DIR: /data
      DELIVERY_DRIVER: local
      DELIVERY_DIR: /delivery
      PUBLISHER_TOKENS: ${PUBLISHER_TOKENS:-${PRODUCER_TOKENS:?Set PUBLISHER_TOKENS in .env}}
      ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-false}
      SOURCE_S3_ENDPOINT: ${SOURCE_S3_ENDPOINT:-}
      SOURCE_S3_BUCKET: ${SOURCE_S3_BUCKET:-}
      SOURCE_S3_PREFIX: ${SOURCE_S3_PREFIX:-}
      SOURCE_S3_REGION: ${SOURCE_S3_REGION:-us-east-1}
      SOURCE_S3_ACCESS_KEY_ID: ${SOURCE_S3_ACCESS_KEY_ID:-}
      SOURCE_S3_SECRET_ACCESS_KEY: ${SOURCE_S3_SECRET_ACCESS_KEY:-}
    ports: ['127.0.0.1:8081:8081']
    volumes: [producer:/data, delivery:/delivery]
    restart: unless-stopped
  mirror:
    build:
      context: .
      target: mirror
    command: [node, apps/mirror/src/main.js]
    init: true
    environment:
      MIRROR_HOST: 0.0.0.0
      MIRROR_DATA_DIR: /data
      DELIVERY_DRIVER: local
      DELIVERY_DIR: /delivery
      COLLECTIONS: ${COLLECTIONS:-docs}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-30000}
      RETAIN_VERSIONS: ${RETAIN_VERSIONS:-3}
    ports: ['127.0.0.1:8080:8080']
    volumes: [consumer:/data, delivery:/delivery:ro]
    restart: unless-stopped
# Keep existing volume identities so renaming services preserves v0.1.0 data.
volumes:
  producer:
  delivery:
  consumer:
